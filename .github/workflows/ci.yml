name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptofolio-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cryptofolio-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check app + functions, production bundle)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test
