<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep dark navy to near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#060a0f"/>
    </linearGradient>

    <!-- Gold gradient for main elements -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#ffc850"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>

    <!-- Gold gradient for line (left to right) -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c87a10" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffc850"/>
      <stop offset="100%" stop-color="#ffe08a"/>
    </linearGradient>

    <!-- Glow filter for chart line -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for dot -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Area fill gradient (under chart) -->
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc850" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffc850" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc850" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffc850" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffc850" stop-opacity="0.2"/>
    </linearGradient>

    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle grid (clipped to icon) -->
  <g clip-path="url(#roundedClip)" opacity="0.045">
    <!-- Vertical lines -->
    <line x1="256"  y1="0" x2="256"  y2="1024" stroke="#ffc850" stroke-width="1.5"/>
    <line x1="512"  y1="0" x2="512"  y2="1024" stroke="#ffc850" stroke-width="1.5"/>
    <line x1="768"  y1="0" x2="768"  y2="1024" stroke="#ffc850" stroke-width="1.5"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="256"  x2="1024" y2="256"  stroke="#ffc850" stroke-width="1.5"/>
    <line x1="0" y1="512"  x2="1024" y2="512"  stroke="#ffc850" stroke-width="1.5"/>
    <line x1="0" y1="768"  x2="1024" y2="768"  stroke="#ffc850" stroke-width="1.5"/>
  </g>

  <!-- Chart area fill (under the line) -->
  <g clip-path="url(#roundedClip)">
    <path
      d="M 148 730
         L 148 730
         C 240 730, 270 620, 330 590
         C 390 560, 420 650, 480 620
         C 540 590, 570 480, 640 420
         C 690 374, 720 430, 780 360
         C 820 312, 850 270, 876 240
         L 876 760
         Z"
      fill="url(#areaFill)"
    />
  </g>

  <!-- Chart line with glow -->
  <path
    d="M 148 730
       C 240 730, 270 620, 330 590
       C 390 560, 420 650, 480 620
       C 540 590, 570 480, 640 420
       C 690 374, 720 430, 780 360
       C 820 312, 850 270, 876 240"
    fill="none"
    stroke="url(#goldLine)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Chart line crisp on top -->
  <path
    d="M 148 730
       C 240 730, 270 620, 330 590
       C 390 560, 420 650, 480 620
       C 540 590, 570 480, 640 420
       C 690 374, 720 430, 780 360
       C 820 312, 850 270, 876 240"
    fill="none"
    stroke="url(#goldLine)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing dot at chart peak -->
  <circle cx="876" cy="240" r="52" fill="#ffc850" opacity="0.18" filter="url(#dotGlow)"/>
  <circle cx="876" cy="240" r="38" fill="#ffc850" opacity="0.3"/>
  <circle cx="876" cy="240" r="24" fill="url(#gold)" filter="url(#dotGlow)"/>
  <circle cx="876" cy="240" r="16" fill="#fff8e8"/>

  <!-- Subtle bottom baseline -->
  <line
    x1="130" y1="760" x2="894" y2="760"
    stroke="#ffc850" stroke-width="3" stroke-opacity="0.12"
    stroke-dasharray="8 12"
    clip-path="url(#roundedClip)"
  />

  <!-- Inner border glow -->
  <rect
    width="1024" height="1024" rx="224" ry="224"
    fill="none"
    stroke="url(#borderGrad)"
    stroke-width="3"
  />
</svg>
